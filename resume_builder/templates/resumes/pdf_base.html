<!DOCTYPE html>
<html lang = 'en'>
<head>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        h2 {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>{{ resume.name }}</h1>

<h2>Skills</h2>
<ul>
{% for skill in resume.skill_set.all %}
    <li>{{ skill.name }} ({{ skill.endorsements }})</li>
{% endfor %}
</ul>

<h2>Sections</h2>

{% for section in resume.section_set.all %}
    <h3>{{ section.title }}</h3>
    <p>{{ section.content }}</p>
{% endfor %}

</body>
</html>
